<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Shorts</title>
<style>
:root{--bg:#07090f;--panel:#10131c;--card:#151922;--border:#252a36;--text:#f2f4f8;--muted:#9aa3b5;--accent:#00d4a8;--neg:#ff5c7a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{margin:0 0 8px;font-size:1.25rem}
p{color:var(--muted);font-size:.9rem;margin:0 0 16px}
input[type=password]{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:1rem;margin-bottom:10px}
button{width:100%;background:var(--accent);color:#04140f;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.err{color:var(--neg);font-size:.85rem;min-height:1.2em;margin:0 0 8px}
.note{font-size:.75rem;color:var(--muted);margin-top:12px}
</style>
</head>

    <input id="gatePw" type="password" autocomplete="current-password" placeholder="頁面密碼" autofocus/>
    <p class="err" id="gateErr"></p>
    <button type="button" id="gateGo">進入</button>
    <p class="note">AES-GCM 密碼門。GitHub 唔存放影片。密碼唔好分享到公開地方。</p>
  </div>
</div>

  const KEY = 'shorts_library_gate_ok';
  const ITER = 200000;

  function b64(s){
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
    return out;
  }
  async function deriveKey(password, salt){
    const enc = new TextEncoder();
    const material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256'},
      material,
      {name:'AES-GCM', length:256},
      false,
      ['decrypt']
    );
  }
  async function decrypt(password){
    const salt = b64(PAYLOAD.salt);
    const iv = b64(PAYLOAD.iv);
    const data = b64(PAYLOAD.ct);
    const key = await deriveKey(password, salt);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, data);
    return new TextDecoder().decode(pt);
  }
  async function unlockWith(password){
    const html = await decrypt(password);
    try { sessionStorage.setItem(KEY, password); } catch(e) {}
    document.open();
    document.write(html);
    document.close();
  }
  async function tryUnlock(password){
    const err = document.getElementById('gateErr');
    try {
      await unlockWith(password);
    } catch (e) {
      err.textContent = '密碼不正確 / Incorrect password';
    }
  }
  document.getElementById('gateGo').addEventListener('click', function(){
    tryUnlock(document.getElementById('gatePw').value);
  });
  document.getElementById('gatePw').addEventListener('keydown', function(e){
    if (e.key === 'Enter') tryUnlock(e.target.value);
  });
  try {
    const saved = sessionStorage.getItem(KEY);
    if (saved) tryUnlock(saved);
  } catch (e) {}
